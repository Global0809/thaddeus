mber','Tuta bianca'],de:['Erlebe jede Dimension.','Drei Designs. Drei Welten. Entdecke Material, Bewegung und Details des AICANFEEL Erlebnisses.','ZURÜCK ZU DEN WELTEN','ENTDECKEN','Schwarzer Trainingsanzug','Bomberjacke','Weißer Trainingsanzug']};let lang=location.pathname.split('/')[1];if(!c[lang]){try{lang=localStorage.getItem('aicanfeel-language')}catch(e){}}if(!c[lang])lang='en';const t=c[lang],prefix=lang==='en'?'':'/'+lang;document.documentElement.lang=lang;document.querySelector('h1').textContent=t[0];document.querySelector('main>p').textContent=t[1];document.querySelector('header>a:last-child').textContent=t[2];document.querySelectorAll('header>a').forEach(a=>a.href=prefix+'/');document.querySelectorAll('.design').forEach((a,i)=>{a.href=prefix+'/'+['black-tracksuit','bomber','white-tracksuit'][i]+'/2';a.querySelector('span').firstChild.textContent=t[i+4];a.querySelector('b').textContent=t[3]});})();</script></body></html>
